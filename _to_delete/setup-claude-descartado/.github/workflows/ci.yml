name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint y formato
        run: |
          npm run lint
          npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Guard de dependencias (sin Bootstrap ni Next.js)
        run: npm run check:deps
      - name: Pruebas unitarias, de integración y de contrato
        run: npm test
      - name: Build
        run: npm run build
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
