AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Plataforma de Donaciones Seguras (proyecto académico, donaciones simuladas): tablas DynamoDB,
  Cognito (Authorization Code + PKCE, MFA TOTP), API Gateway HTTP API con JWT authorizer y
  funciones Lambda con IAM de privilegio mínimo. Las rutas protegidas se enlazan función por función
  en las tareas de cada historia (T067, T075, T093, T100). Ya están enlazadas las rutas públicas del
  catálogo (T042) y la de simulación, exclusiva del stage `academic` (T027).

Parameters:
  Stage:
    Type: String
    Default: academic
    AllowedValues:
      - academic
      - dev
    Description: >
      Entorno de despliegue. La ruta de simulación de donaciones existe únicamente en `academic`
      (FR-017); en cualquier otro stage no se crea.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:5173"
    Description: Orígenes exactos permitidos por CORS (sin comodines). Añadir el dominio de CloudFront (T115).
  CallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:5173/callback"
    Description: URIs de redirección tras el login (https, salvo localhost).
  LogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:5173/"
    Description: URIs de redirección tras el cierre de sesión (https, salvo localhost).

Conditions:
  IsAcademicStage: !Equals [!Ref Stage, academic]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256
    CodeUri: ../backend/
    Environment:
      Variables:
        STAGE: !Ref Stage
        PROJECTS_TABLE: !Ref ProjectsTable
        DONATIONS_TABLE: !Ref DonationsTable
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        AUDIT_TABLE: !Ref AuditEventsTable
        COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        ALLOWED_ORIGINS:
          !Join [
            ",",
            [!Join [",", !Ref AllowedOrigins], !Sub "https://${SpaDistribution.DomainName}"],
          ]

Resources:
  # ---------------------------------------------------------------------------------------------
  # DynamoDB (T023): on-demand, cifrado en reposo administrado por AWS, importes enteros (N).
  # Nombres físicos: <Stage>Projects, <Stage>Donations, <Stage>Idempotency, <Stage>AuditEvents.
  # ---------------------------------------------------------------------------------------------
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Stage}Projects"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DonationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Stage}Donations"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: donationId
          AttributeType: S
        - AttributeName: donorSub
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: donationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: donorSub-createdAt
          KeySchema:
            - AttributeName: donorSub
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - projectId
              - amountCents
              - currency
              - status
              - updatedAt

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Stage}Idempotency"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Stage}AuditEvents"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: eventType
          KeyType: HASH
        - AttributeName: sk # valor: <timestamp>#<eventId>
          KeyType: RANGE

  # ---------------------------------------------------------------------------------------------
  # Cognito (T024): Authorization Code + PKCE (sin flujo implícito), access token de 15 min,
  # refresh revocable y MFA TOTP (sin SMS).
  # Limitación: Cognito aplica MFA a nivel de User Pool, no por grupo. Para garantizar que GESTOR y
  # AUDITOR no obtengan tokens sin segundo factor (CA-11.2) se exige TOTP a todos los usuarios.
  # ---------------------------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "secure-donations-${Stage}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: "ON"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      DeletionProtection: INACTIVE

  UserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: api
      Name: !Sub "secure-donations-${Stage}-api"
      Scopes:
        - ScopeName: projects.write
          ScopeDescription: Crear y publicar proyectos (GESTOR)
        - ScopeName: donations.write
          ScopeDescription: Crear donaciones y simular confirmación/rechazo (DONANTE)
        - ScopeName: donations.read
          ScopeDescription: Consultar el historial y las donaciones propias (DONANTE)
        - ScopeName: audit.read
          ScopeDescription: Consultar auditoría (AUDITOR; HU-10 diferido)

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolResourceServer
    Properties:
      ClientName: !Sub "secure-donations-${Stage}-spa"
      UserPoolId: !Ref UserPool
      GenerateSecret: false # cliente público (SPA): PKCE en lugar de secreto
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code # solo Authorization Code; el flujo implícito no se habilita
      AllowedOAuthScopes:
        - openid
        - api/projects.write
        - api/donations.write
        - api/donations.read
        - api/audit.read
      CallbackURLs:
        !Split [
          ",",
          !Join [
            ",",
            [!Join [",", !Ref CallbackUrls], !Sub "https://${SpaDistribution.DomainName}/callback"],
          ],
        ]
      LogoutURLs:
        !Split [
          ",",
          !Join [
            ",",
            [!Join [",", !Ref LogoutUrls], !Sub "https://${SpaDistribution.DomainName}/"],
          ],
        ]
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "secure-donations-${Stage}-${AWS::AccountId}"

  DonanteGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: DONANTE
      Description: Donantes (donar, simular e historial propio)
      Precedence: 30

  GestorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: GESTOR
      Description: Gestores (crear y publicar proyectos)
      Precedence: 20

  AuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: AUDITOR
      Description: Auditores (consulta de auditoría; HU-10 diferido)
      Precedence: 10

  # ---------------------------------------------------------------------------------------------
  # API Gateway HTTP API (T025). El JWT authorizer valida firma, emisor, expiración y audiencia
  # (`client_id`). Los ID tokens también portan `aud`, por lo que TODA ruta protegida debe declarar
  # `AuthorizationScopes`: los ID tokens no tienen scopes y quedan rechazados. No hay authorizer por
  # defecto: cada ruta protegida lo declara explícitamente junto con sus scopes.
  # ---------------------------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      # Límite por defecto de todas las rutas del stage (T116): frena abusos y fuerza bruta.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      # Registro de acceso SIN datos personales ni tokens (sin IP, sin cabeceras, sin claims).
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","integrationStatus":"$context.integrationStatus"}'
      CorsConfiguration:
        AllowOrigins:
          !Split [
            ",",
            !Join [
              ",",
              [!Join [",", !Ref AllowedOrigins], !Sub "https://${SpaDistribution.DomainName}"],
            ],
          ]
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
          - idempotency-key
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  # ---------------------------------------------------------------------------------------------
  # Funciones Lambda (T026): una por caso de uso, con IAM de privilegio mínimo (solo las tablas y
  # acciones necesarias). Las lecturas previas (GetItem) permiten responder 404 antes de abrir
  # transacciones. Los handlers los implementan T041, T067, T074, T085, T092, T100; sus rutas
  # (`Events`) se enlazan en las tareas de cada historia.
  # Nota de build: `sam build` (esbuild) requiere que existan los archivos de cada EntryPoint.
  # ---------------------------------------------------------------------------------------------
  ListProjectsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/projects/handlers/listProjects.ts
    Properties:
      Handler: listProjects.handler
      LoggingConfig:
        LogGroup: !Ref ListProjectsLogGroup
      Description: GET /v1/projects (público)
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${ProjectsTable.Arn}/index/status-createdAt"
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects
            Method: GET

  GetProjectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/projects/handlers/getProject.ts
    Properties:
      Handler: getProject.handler
      LoggingConfig:
        LogGroup: !Ref GetProjectLogGroup
      Description: GET /v1/projects/{projectId} (público)
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ProjectsTable.Arn
      Events:
        Detail:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects/{projectId}
            Method: GET

  GetProjectStatsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/projects/handlers/getProjectStats.ts
    Properties:
      Handler: getProjectStats.handler
      LoggingConfig:
        LogGroup: !Ref GetProjectStatsLogGroup
      Description: GET /v1/projects/{projectId}/stats (público)
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ProjectsTable.Arn
      Events:
        Stats:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects/{projectId}/stats
            Method: GET

  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/projects/handlers/createProject.ts
    Properties:
      Handler: createProject.handler
      LoggingConfig:
        LogGroup: !Ref CreateProjectLogGroup
      Description: POST /v1/projects (GESTOR, scope api/projects.write)
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - api/projects.write
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource:
                - !GetAtt ProjectsTable.Arn
                - !GetAtt AuditEventsTable.Arn

  PublishProjectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/projects/handlers/publishProject.ts
    Properties:
      Handler: publishProject.handler
      LoggingConfig:
        LogGroup: !Ref PublishProjectLogGroup
      Description: PATCH /v1/projects/{projectId}/publish (GESTOR, scope api/projects.write)
      Events:
        Publish:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects/{projectId}/publish
            Method: PATCH
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - api/projects.write
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProjectsTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditEventsTable.Arn

  CreateDonationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/donations/handlers/createDonation.ts
    Properties:
      Handler: createDonation.handler
      LoggingConfig:
        LogGroup: !Ref CreateDonationLogGroup
      Description: POST /v1/donations (DONANTE, scope api/donations.write)
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/donations
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - api/donations.write
      Policies:
        - Statement:
            # Lectura previa del proyecto (404) y condición dentro de la transacción (409).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt ProjectsTable.Arn
            # Escritura de la donación y lectura para devolver el resultado en una repetición.
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt DonationsTable.Arn
            # Reserva atómica de la clave y lectura del registro tras una cancelación.
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt IdempotencyTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditEventsTable.Arn

  SimulateDonationFunction:
    Type: AWS::Serverless::Function
    Condition: IsAcademicStage # T027: no existe fuera del stage academic
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/donations/handlers/simulateDonation.ts
    Properties:
      Handler: simulateDonation.handler
      LoggingConfig:
        LogGroup: !Ref SimulateDonationLogGroup
      Description: POST /v1/donations/{donationId}/simulate (DONANTE propietario; solo stage academic)
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt DonationsTable.Arn
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ProjectsTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditEventsTable.Arn
      Events:
        Simulate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/donations/{donationId}/simulate
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - api/donations.write

  ListMyDonationsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/donations/handlers/listMyDonations.ts
    Properties:
      Handler: listMyDonations.handler
      LoggingConfig:
        LogGroup: !Ref ListMyDonationsLogGroup
      Description: GET /v1/donations/me (DONANTE, scope api/donations.read)
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${DonationsTable.Arn}/index/donorSub-createdAt"

  GetDonationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/donations/handlers/getDonation.ts
    Properties:
      Handler: getDonation.handler
      LoggingConfig:
        LogGroup: !Ref GetDonationLogGroup
      Description: GET /v1/donations/{donationId} (DONANTE propietario, scope api/donations.read)
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt DonationsTable.Arn

  # ---------------------------------------------------------------------------------------------
  # Hosting de la SPA (T115): bucket S3 PRIVADO + CloudFront con OAC (SigV4) y cabeceras de seguridad.
  # Nada se sirve desde S3 directamente: solo la distribución puede leer los objetos.
  # ---------------------------------------------------------------------------------------------
  SpaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  SpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SpaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SpaBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SpaDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SpaBucket.Arn
              - !Sub "${SpaBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  SpaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "secure-donations-${Stage}-${AWS::AccountId}-oac"
        Description: Acceso de CloudFront al bucket privado de la SPA
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CSP: la API se permite por comodín de subdominio (`*.execute-api`) porque su URL exacta crearía una
  # dependencia circular (la API necesita el dominio de CloudFront para CORS). El resto es exacto.
  SpaResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "secure-donations-${Stage}-${AWS::AccountId}-security-headers"
        Comment: Cabeceras de seguridad de la SPA
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://cognito-idp.${AWS::Region}.amazonaws.com https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=()
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true

  SpaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "secure-donations-${Stage} SPA"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: spa-s3
            DomainName: !GetAtt SpaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SpaOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: spa-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized (gestionada por AWS)
          ResponseHeadersPolicyId: !Ref SpaResponseHeadersPolicy
        # Enrutamiento de la SPA: S3 con OAC responde 403 a las claves inexistentes.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        # Con el certificado por defecto de CloudFront la versión mínima de TLS no es configurable
        # (TLS 1.2 exige un dominio propio con certificado de ACM; fuera del alcance académico).
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # ---------------------------------------------------------------------------------------------
  # Observabilidad (T116): registros con retención de 14 días, registro de acceso de la API sin datos
  # personales y CloudTrail (eventos de administración) en un bucket privado.
  # ---------------------------------------------------------------------------------------------
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/http-api/secure-donations-${Stage}-access"
      RetentionInDays: 14

  ListProjectsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/secure-donations-${Stage}-listProjects"
      RetentionInDays: 14

  GetProjectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/secure-donations-${Stage}-getProject"
      RetentionInDays: 14

  GetProjectStatsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/secure-donations-${Stage}-getProjectStats"
      RetentionInDays: 14

  CreateProjectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/secure-donations-${Stage}-createProject"
      RetentionInDays: 14

  PublishProjectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/secure-donations-${Stage}-publishProject"
      RetentionInDays: 14

  CreateDonationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/secure-donations-${Stage}-createDonation"
      RetentionInDays: 14

  SimulateDonationLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsAcademicStage
    Properties:
      LogGroupName: !Sub "/aws/lambda/secure-donations-${Stage}-simulateDonation"
      RetentionInDays: 14

  ListMyDonationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/secure-donations-${Stage}-listMyDonations"
      RetentionInDays: 14

  GetDonationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/secure-donations-${Stage}-getDonation"
      RetentionInDays: 14

  TrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAuditLogs
            Status: Enabled
            ExpirationInDays: 90

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/secure-donations-${Stage}-trail"
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                "s3:x-amz-acl": bucket-owner-full-control
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/secure-donations-${Stage}-trail"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TrailBucket.Arn
              - !Sub "${TrailBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Sub "secure-donations-${Stage}-trail"
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: false

Outputs:
  Stage:
    Description: Stage desplegado
    Value: !Ref Stage
  ResourcePrefix:
    Description: Prefijo de nombres de recursos para este stage
    Value: !Sub "secure-donations-${Stage}"
  ApiUrl:
    Description: URL base de la API (valor de VITE_API_BASE_URL)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UserPoolId:
    Description: ID del User Pool de Cognito
    Value: !Ref UserPool
  UserPoolClientId:
    Description: ID del app client de la SPA (valor de VITE_OIDC_CLIENT_ID)
    Value: !Ref UserPoolClient
  CognitoIssuer:
    Description: Emisor OIDC (valor de VITE_OIDC_AUTHORITY)
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  CognitoDomain:
    Description: Dominio del Hosted UI sin esquema (valor de VITE_OIDC_COGNITO_DOMAIN)
    Value: !Sub "${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  SimulationRouteEnabled:
    Description: Indica si la ruta de simulación académica existe en este stage
    Value: !If [IsAcademicStage, "true", "false"]
  SpaBucketName:
    Description: Bucket privado de la SPA (destino de `aws s3 sync`)
    Value: !Ref SpaBucket
  SpaDistributionId:
    Description: ID de la distribución de CloudFront (para invalidar la caché)
    Value: !Ref SpaDistribution
  SpaUrl:
    Description: URL pública de la SPA
    Value: !Sub "https://${SpaDistribution.DomainName}"
