name: DevSecOps CI (Zero Trust Quality Gate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Security & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check Constitutional Dependency Guards
        run: node scripts/check-deps.mjs

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (DevSecOps)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint (ESLint)
        run: npm run lint --if-present

      - name: Typecheck (TypeScript)
        run: npm run typecheck --if-present

      - name: Run Tests (Vitest & Negative Security Tests)
        run: npm test --if-present

      - name: Build Workspaces
        run: npm run build --if-present
