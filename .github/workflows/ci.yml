name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (versions fixed by package-lock.json)
        run: npm ci

      - name: Dependency guard (no Bootstrap / Next.js)
        run: npm run check-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit, integration, contract)
        run: npm test

      - name: OpenAPI validation
        run: npm run contract:validate

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
